<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSK 4급</title>

    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22HSK%204%EA%B8%89%20%EB%A7%88%EC%8A%A4%ED%84%B0%22%2C%22short_name%22%3A%22HSK%204%EA%B8%89%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f9f6f0%22%2C%22theme_color%22%3A%22%238d5b4c%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22.%2Ficon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --primary: #8d5b4c;         
            --primary-light: #f5ece6;    
            --success: #588157;         
            --danger: #bc4749;         
            --danger-light: #fdf2f2;
            --warning: #dda15e;         
            --warning-light: #fef6ec; 
            
            --bg: #f9f6f0;              
            --card-bg: #ffffff;         
            --text: #3d312a;            
            --gray: #8c7a6b;            
            --gray-light: #f4eee6;      
            --border: #e6ded3;          
            
            --beige-box: #f9f4ee;       
            --expl-box-bg: #FDF8F3;     
            --expl-border: #E0D2C3;     
            --btn-sub-bg: #F4EEE6;      
            --btn-sub-border: #DCD4C9;  
            --btn-sub-text: #3D312A;    
            --in-btn-bg: #FFFFFF;       
            --brown-text: #6b473b;      
            --dark-brown: #52352b;      
            
            --shadow-sm: 0 4px 12px rgba(61, 49, 42, 0.04);
            --shadow-lg: 0 12px 32px rgba(61, 49, 42, 0.08);
        }
        
        body, div, span, button, input, select, h1, h2, h3 {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 600;
            touch-action: manipulation;
        }
        
        body {
            background: var(--bg);
            margin: 0;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: var(--text);
            line-height: 1.4;
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
        }
        .nav-btn:active { opacity: 0.5; }
        .nav-title { font-size: 17px; font-weight: 700; color: var(--text); }
        
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 3px;
        }

        .panel {
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .icon-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        
        .icon-menu-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 24px 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }
        .icon-menu-btn:active { transform: scale(0.97); background: var(--gray-light); }
        .icon-menu-btn .icon { font-size: 28px; }
        .icon-menu-btn .label { font-size: 18px; font-weight: 700; color: var(--text); }
        
        .quiz-menu-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            color: var(--brown-text);
            padding: 33px 20px; 
            font-size: 17px;
            font-weight: 700;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .quiz-menu-btn div {
            color: var(--brown-text); 
            font-weight: 800;
            font-size: 16px; 
        }
        .quiz-menu-btn:active { transform: scale(0.97); background: var(--gray-light); }
        .quiz-menu-btn span { font-size: 13px; color: var(--gray); font-weight: 500; }

        button {
            padding: 14px;
            font-size: 15px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
        }
        button:active { transform: scale(0.97); opacity: 0.9; }
        
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; width: 100%; }
        .btn-secondary { background: var(--gray-light); color: var(--text); width: 100%; }
        
        .btn-x { background: var(--text); color: #ffffff; font-size: 22px; font-weight: 800; box-shadow: var(--shadow-sm); padding: 32px 18px; }
        .btn-o { background: var(--card-bg); color: black; font-size: 22px; font-weight: 800; box-shadow: var(--shadow-sm); padding: 32px 18px; }
        
        .day-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .day-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            padding: 22px 16px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            position: relative;
            box-shadow: var(--shadow-sm);
        }
        .day-card:active { transform: scale(0.95); background: var(--gray-light); }
        .day-complete-checkbox {
            width: 22px;
            height: 22px;
            margin: 0;
            flex: 0 0 auto;
            accent-color: var(--primary);
            cursor: pointer;
            touch-action: manipulation;
        }
        
        /* 1. 단어장 카드(흰색 화면) 크기를 가로 기준 4:5 비율로 설정 */
        .flashcard {
            background: var(--card-bg);
            width: 100%;
            aspect-ratio: 4 / 5;
            padding: 20px 16px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            box-sizing: border-box;
        }
        
        .status-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 2;
        }
        
        .btn-group { display: flex; gap: 8px; width: 100%; margin-bottom: 6px; }
        .btn-group button { flex: 1; padding: 12px; font-weight: 800; }
        
        .quiz-box { 
            font-size: 17px; 
            font-weight: 700; 
            margin-bottom: 16px; 
            padding: 36px 20px; 
            background: var(--beige-box); 
            border-radius: 20px; 
            min-height: 160px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            border: 1.5px solid var(--border);
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
        }
        
        .quiz-options { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-bottom: 16px; 
        }
        
        .quiz-opt-btn, .quiz-action-btn { 
            background: var(--card-bg); 
            color: var(--text); 
            width: 100%; 
            border: 1.5px solid var(--border); 
            padding: 18px 14px; 
            font-size: 16px; 
            text-align: center; 
            border-radius: 16px; 
            font-weight: 700; 
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
        }
        .btn-correct { background-color: var(--success) !important; color: white !important; }
        .btn-wrong { background-color: var(--danger) !important; color: white !important; }
        
        .control-group { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 12px 14px; border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
        .control-group label { font-size: 14px; font-weight: 700; color: var(--text); }
        .control-select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-size: 14px; font-weight: 600; outline: none; color: var(--text); }
        .radio-group { display: flex; gap: 14px; font-size: 13px; font-weight: 600; }
        
        input[type="radio"], input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .blank-text { color: var(--primary); font-weight: 800; letter-spacing: 2px; }
        .highlight-word { color: var(--danger); font-weight: 800; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container" id="app-wrapper">
        <div id="top-nav" class="top-nav hidden">
            <button class="nav-btn" onclick="goHome()">🏠 홈</button>
            <span id="nav-title" class="nav-title">학습</span>
            <button class="nav-btn" onclick="goSettings()">⚙️ 설정</button>
        </div>

        <div id="screen-home">
            <div class="panel" style="margin-bottom: 30px; padding: 32px 18px; background: var();">
                <h1 style="margin: 0 0 6px 0; font-size: 26px; color: var(--primary);">HSK</h1>
                <p style="margin: 0; color: var(--gray); font-size: 14px; font-weight: 500;">매일 조금씩 단어 외우기 ^_^v</p>
            </div>

            <div class="icon-menu-grid">
                <button class="icon-menu-btn" onclick="openVocbDays()">
                    <span class="icon">📚</span>
                    <span class="label">단어장 학습</span>
                </button>
                <button class="icon-menu-btn" onclick="openQuizMenu()">
                    <span class="icon">📝</span>
                    <span class="label">퀴즈</span>
                </button>
                <button class="icon-menu-btn" onclick="openReview()">
                    <span class="icon">🔥</span>
                    <span class="label">오답노트</span>
                </button>
            </div>

            <div style="margin-top: 200px; text-align: left;">
                <span onclick="goSettings()" style="font-size: 14px; font-weight: 600; color: var(--gray); cursor: pointer;">⚙️ 설정</span>
            </div>
        </div>

        <div id="screen-vocab-days" class="hidden">
            <div style="margin-bottom:16px;">
                <div style="position:relative;">
                    <input id="vocab-search-input" type="search" placeholder="단어 · 병음 · 뜻 검색" autocomplete="off"
                        style="width:100%; box-sizing:border-box; padding:15px 44px 15px 16px; border:1px solid var(--border); border-radius:14px; background:white; color:var(--text); font-size:15px; outline:none;">
                    <button type="button" onclick="clearVocabSearch()" aria-label="검색어 지우기"
                        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--gray); font-size:18px; padding:6px; cursor:pointer;">×</button>
                </div>
                <div id="vocab-search-result" class="hidden" style="margin-top:10px;"></div>
            </div>

            <!-- 범위 학습 버튼 -->
            <button class="quiz-menu-btn" onclick="openVocabRangeSettings()" style="margin-bottom:16px; padding:19px 20px; background:var(--gray); color:#fff;">
                <div style="color:#f5ece6; ">📚 학습하기</div>
                <span style="color:#f4eee6; ">범위를 선택해서 학습</span>
            </button>

            <div id="day-grid" class="day-grid"></div>
        </div>

        <div id="screen-vocab-range-settings" class="hidden">
            <div class="panel" style="text-align:left; padding:20px;">
                <h3 style="margin:0 0 14px 0; font-size:18px; color:var(--primary);">📚 학습 범위 설정</h3>
                <div class="control-group" style="margin-bottom:10px;">
                    <label>순서</label>
                    <div class="radio-group">
                        <label><input type="radio" name="vocab-range-order" value="sequential" checked> 순차</label>
                        <label><input type="radio" name="vocab-range-order" value="random"> 랜덤</label>
                    </div>
                </div>
                <div class="control-group" style="flex-direction:column; align-items:flex-start; gap:8px; margin-bottom:10px;">
                    <label>범위 지정</label>
                    <div style="display:flex; align-items:center; gap:8px; width:100%;">
                        <select id="vocab-range-start-day" class="control-select" style="flex:1;"></select>
                        <span style="font-weight:800; color:var(--border);">~</span>
                        <select id="vocab-range-end-day" class="control-select" style="flex:1;"></select>
                    </div>
                </div>
                <div class="control-group" style="flex-direction:column; align-items:flex-start; gap:6px; margin-bottom:16px;">
                    <label>출제 (복수 선택 가능)</label>
                    <div class="radio-group" style="width:100%; justify-content:space-between; flex-wrap:wrap;">
                        <label><input type="checkbox" name="vocab-range-status" value="1" checked> 🟤 외움</label>
                        <label><input type="checkbox" name="vocab-range-status" value="2" checked> 🟠 헷갈림</label>
                        <label><input type="checkbox" name="vocab-range-status" value="0" checked> ⚪ 모름</label>
                    </div>
                </div>
                <button class="btn-primary" onclick="startRangeVocabSession()">학습 시작하기 🚀</button>
            </div>
            <button class="btn-secondary" onclick="openVocbDays()">◀ Day 목록으로</button>
        </div>

        <div id="screen-vocab-day-detail" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <button class="nav-btn" onclick="openVocbDays()" style="padding: 0; font-size: 13px;">◀ Day 목록으로</button>
                <div id="day-detail-title" style="font-size: 16px; font-weight: 800; color: var(--primary);"></div>
            </div>
            
            <button class="btn-primary" onclick="openVocbOptions()" style="padding: 16px; font-size: 16px; margin-bottom: 14px; border-radius: 16px;">🚀 학습하기</button>

            <div id="day-words-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;"></div>
        </div>

        <div id="screen-vocab-options" class="hidden">
            <div class="panel" style="text-align: left; padding: 20px; margin-bottom: 16px;">
                <h3 id="vocab-option-title" style="margin:0 0 14px 0; font-size:18px; color: var(--primary);">학습 설정</h3>
                
                <div class="control-group" style="margin-bottom: 10px;">
                    <label>순서</label>
                    <div class="radio-group">
                        <label><input type="radio" name="vocab-mode" value="sequential" checked> 순차</label>
                        <label><input type="radio" name="vocab-mode" value="random"> 랜덤</label>
                    </div>
                </div>

                <div class="control-group" style="flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 16px;">
                    <label>출제 (복수 선택 가능)</label>
                    <div class="radio-group" style="width: 100%; justify-content: space-between; flex-wrap: wrap;">
                        <label><input type="checkbox" name="vocab-status" value="1" checked> 🟤 외움</label>
                        <label><input type="checkbox" name="vocab-status" value="2" checked> 🟠 헷갈림</label>
                        <label><input type="checkbox" name="vocab-status" value="0" checked> ⚪ 모름</label>
                    </div>
                </div>

                <button class="btn-primary" onclick="startVocabSessionFromOptions()">학습 시작하기 🚀</button>
            </div>
            <button class="btn-secondary" onclick="selectVocbDay(selectedStartIdx, selectedEndIdx, selectedDayNum)">◀ 단어 목록으로 돌아가기</button>
        </div>

        <div id="screen-vocab-card" class="hidden">
            <div class="progress-bar-container">
                <div id="vocab-progress-bar" class="progress-bar-fill"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <button class="nav-btn" onclick="selectVocbDay(selectedStartIdx, selectedEndIdx, selectedDayNum)" style="padding: 0; font-size: 13px;">◀ 단어 목록으로</button>
                <div style="font-size:13px; font-weight:600; color:var(--gray);" id="vocab-progress">0 / 0</div>
            </div>

            <!-- 오답노트와 동일한 카드 터치 구조: 카드 전체가 뒤집히고, 버튼은 stopPropagation으로 분리 -->
            <div id="flashcard-elem" class="flashcard" onclick="toggleCardFront()">
                <div id="vc-status-badge" class="status-badge" onclick="event.stopPropagation(); cycleWordStatus();" title="상태 변경">⚪</div>

                <div id="vc-front-content" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
                    <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
                        <div id="vc-word" style="font-size: 48px; font-weight: 800; color: var(--text);"></div>
                    </div>
                    <div style="height: 33%; display: flex; align-items: flex-start; justify-content: center;">
                        <button type="button" class="btn-secondary" style="background: var(--bg); color: var(--text); border: none; border-radius: 14px; padding: 12px 24px; font-size: 14px; font-weight: 700; width: auto;" onclick="event.preventDefault(); event.stopPropagation(); speakChinese(currentList[currentIndex].word); return false;">🔊 단어 듣기</button>
                    </div>
                </div>

                <div id="vc-back" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
                        <div id="vc-word-back" style="font-size: 32px; font-weight: 800; color: var(--text); margin-bottom: 6px;"></div>
                        <div id="vc-pinyin" style="font-size: 20px; color: var(--primary); margin-bottom: 8px; font-weight: 700;"></div>
                        <div id="vc-meaning" style="font-size: 18px; color: var(--text); margin-bottom: 26px; font-weight: 700;"></div>

                        <div id="vc-example-box" style="background: var(--bg); padding: 20px 16px; border-radius: 16px; text-align: left; width: 100%; box-sizing: border-box; border: 1px solid var(--border);">
                            <div id="vc-ex-zh" style="margin-bottom:7px; font-weight:600; color:var(--text); font-size: 15px;"></div>
                            <div id="vc-ex-py" style="margin-bottom:7px; font-size:13px; color:var(--primary); font-weight: 500;"></div>
                            <div id="vc-ex-ko" style="color:var(--text); font-weight: 500; font-size: 13px; margin-bottom: 16px;"></div>
                            <div style="display: flex; gap: 8px; width: 100%;">
                                <button type="button" style="flex: 1; background: var(--gray-light); color: var(--text); border: none; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation;" onclick="event.preventDefault(); event.stopPropagation(); speakChinese(currentList[currentIndex].word); return false;">🔊 단어 듣기</button>
                                <button type="button" style="flex: 1; background: var(--gray-light); color: var(--text); border: none; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation;" onclick="event.preventDefault(); event.stopPropagation(); playExampleAudio(currentList[currentIndex]); return false;">🔊 예문 전체 듣기</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="vocab-study-btn-group" class="btn-group">
                <button class="btn-x" onclick="markVocbResult(false)">X</button>
                <button class="btn-o" onclick="markVocbResult(true)">O</button>
            </div>
            <div id="vocab-nav-btn-group" class="btn-group">
                <button class="btn-secondary" onclick="prevVocbCard()" style="width: 100%;">◀ 이전 단어</button>
            </div>
        </div>

        <div id="screen-vocab-result" class="hidden">
            <div class="panel" style="padding: 28px 20px;">
                <h2 style="margin:0 0 10px 0; font-size:22px; color:var(--primary);">단어 학습 완료! 🎉</h2>
                <div id="vocab-result-score" style="font-size: 52px; line-height:1.05; font-weight: 800; color: var(--primary); margin: 8px 0 4px;">0%</div>
                <div id="vocab-result-desc" style="color: var(--gray); margin-bottom: 22px; font-size: 16px; font-weight:700;">0 / 0</div>
                <div class="btn-group" style="flex-direction: column; gap: 8px;">
                    <button class="btn-primary" onclick="restartVocbSession(false)">🔄 다시 학습하기</button>
                    <button id="btn-vocab-retry-wrong" class="btn-danger" onclick="restartVocbSession(true)">🔥 틀린 단어만 학습하기</button>

    <script>
        const CHUNK_SIZE = 40;
        let allWords = [];
        let currentList = [];
        
        let selectedStartIdx = 0;
        let selectedEndIdx = 0;
        let selectedDayNum = 1;
        let currentVocbWrongItems = [];
        let reviewSessionWordIds = [];
        let originalQuizList = [];
        let currentQuizWrongItems = [];
        
        let currentIndex = 0;
        let score = 0;
        let isFlipped = false;
        let currentQuizType = '';
        let isDirectStudyMode = false;
        let isRangeVocabMode = false;
        
        let wordStatuses = JSON.parse(localStorage.getItem('hsk_word_statuses') || '{}');
        let wrongWordIds = JSON.parse(localStorage.getItem('hsk_wrong_words') || '[]');
        // 단어별 누적 정답률: { word_id: { correct: 0, total: 0 } }
        let wordAccuracy = JSON.parse(localStorage.getItem('hsk_word_accuracy') || '{}');

        // 정답률 기준 자동 상태
        // 90% 이상 = 외움(1) / 40~89% = 헷갈림(2) / 39% 이하 = 모름(0)
        function updateAutomaticWordStatus(wordId) {
            const stat = wordAccuracy[wordId];
            if (!stat || stat.total <= 0) return;

            const accuracy = (stat.correct / stat.total) * 100;
            let status = 0;
            if (accuracy >= 90) status = 1;
            else if (accuracy >= 40) status = 2;

            if (status === 0) delete wordStatuses[wordId];
            else wordStatuses[wordId] = status;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
        }

        function recordWordResult(wordId, isCorrect) {
            if (!wordAccuracy[wordId]) wordAccuracy[wordId] = { correct: 0, total: 0 };
            wordAccuracy[wordId].total += 1;
            if (isCorrect) wordAccuracy[wordId].correct += 1;
            updateAutomaticWordStatus(wordId);
            localStorage.setItem('hsk_word_accuracy', JSON.stringify(wordAccuracy));
        }

        async function loadWordsData() {
            try {
                const response = await fetch('./hsk_basic_words_800.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                allWords = data.map((item, index) => {
                    let pureMeaning = item.meaning;
                    if (pureMeaning && pureMeaning.includes('\t')) {
                        const parts = pureMeaning.split('\t');
                        pureMeaning = parts[parts.length - 1];
                    }

                    return {
                        word_id: item.word_id !== undefined ? item.word_id : index,
                        word: item.hanzi || item.word,
                        pinyin: item.pinyin, 
                        meaning: pureMeaning,
                        example_zh: item.example_sentence || item.example_zh,
                        example_pinyin: item.example_pinyin,
                        example_ko: item.example_meaning || item.example_ko
                    };
                });
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert("단어장 데이터(hsk_basic_words_800.json)를 불러오지 못했습니다. 파일 위치나 파일명을 확인해주세요.");
            }
        }

        // iPad/iOS Safari에서는 기본 음성이 중국어 텍스트를 다른 언어처럼 읽는 경우가 있어
        // 사용 가능한 중국어(zh-CN) 음성을 직접 선택합니다.
        let chineseVoice = null;

        function findChineseVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const zhVoices = voices.filter(v =>
                /^zh(?:-|_|$)/i.test(v.lang) ||
                /chinese|mandarin|中文|普通话|國語/i.test(v.name)
            );
            // iOS에서 자주 제공되는 중국어 음성을 우선하고, 없으면 zh-CN 계열을 사용
            return zhVoices.find(v => /^zh-CN$/i.test(v.lang)) ||
                   zhVoices.find(v => /^zh_CN$/i.test(v.lang)) ||
                   zhVoices.find(v => /Ting-Ting|婷婷/i.test(v.name)) ||
                   zhVoices.find(v => /^zh/i.test(v.lang)) ||
                   zhVoices[0] || null;
        }

        function refreshChineseVoice() {
            chineseVoice = findChineseVoice();
        }

        if ('speechSynthesis' in window) {
            refreshChineseVoice();
            window.speechSynthesis.addEventListener('voiceschanged', refreshChineseVoice);
        }

        function speakChinese(text) {
            if (!('speechSynthesis' in window) || !text) return;
            const synth = window.speechSynthesis;
            synth.cancel();

            // iPad는 음성 목록이 늦게 로드될 수 있으므로 버튼을 눌렀을 때도 다시 확인
            const voice = chineseVoice || findChineseVoice();
            const utterance = new SpeechSynthesisUtterance(String(text));
            utterance.lang = voice ? voice.lang : 'zh-CN';
            utterance.rate = 1.0;
            utterance.pitch = 1;
            if (voice) utterance.voice = voice;

            synth.speak(utterance);
        }

        function playExampleAudio(item) {
            if (item && item.example_zh) speakChinese(item.example_zh);
            else speakChinese(item.word);
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function showScreen(screenId) {
            const screens = ['screen-home', 'screen-vocab-days', 'screen-vocab-range-settings', 'screen-vocab-day-detail', 'screen-vocab-options', 'screen-vocab-card', 'screen-vocab-result', 'screen-quiz-menu', 'screen-quiz-settings', 'screen-quiz-play', 'screen-review', 'screen-settings', 'screen-result'];
            screens.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(screenId);
            if (target) target.classList.remove('hidden');

            const topNav = document.getElementById('top-nav');
            const navTitle = document.getElementById('nav-title');
            if (screenId === 'screen-home') {
                if (topNav) topNav.classList.add('hidden');
            } else {
                if (topNav) topNav.classList.remove('hidden');
                const titles = {
                    'screen-vocab-days': 'Day 선택', 'screen-vocab-range-settings': '학습 범위 설정', 'screen-vocab-day-detail': '단어 목록', 'screen-vocab-card': `Day ${selectedDayNum || ''}`, 'screen-vocab-result': '학습 완료',
                    'screen-quiz-menu': '퀴즈', 'screen-quiz-settings': '퀴즈 설정', 'screen-quiz-play': '퀴즈',
                    'screen-review': '오답 집중 훈련', 'screen-settings': '설정', 'screen-result': '결과 확인'
                };
                if (navTitle) navTitle.innerText = titles[screenId] || '';
            }
            window.scrollTo(0, 0);
        }

        function goVocabDays() { showScreen('screen-vocab-days'); if (typeof openVocbDays === 'function') openVocbDays(); }
        function goHome() { showScreen('screen-home'); }
        function goSettings() { showScreen('screen-settings'); }

        function openVocabRangeSettings() {
            showScreen('screen-vocab-range-settings');
            if (!allWords || allWords.length === 0) return;
            const totalDays = Math.ceil(allWords.length / CHUNK_SIZE) || 1;
            const start = document.getElementById('vocab-range-start-day');
            const end = document.getElementById('vocab-range-end-day');
            if (!start || !end) return;
            const prevStart = parseInt(start.value) || 1;
            const prevEnd = parseInt(end.value) || totalDays;
            start.innerHTML = ''; end.innerHTML = '';
            for (let d=1; d<=totalDays; d++) { start.add(new Option(`Day ${d}`,d)); end.add(new Option(`Day ${d}`,d)); }
            start.value = String(Math.min(prevStart,totalDays));
            end.value = String(Math.min(Math.max(prevEnd,1),totalDays));
            if (parseInt(start.value) > parseInt(end.value)) end.value = start.value;
        }

        function normalizeSearchText(value) {
            return String(value || '').toLowerCase().trim();
        }

        function searchVocabWords() {
            const input = document.getElementById('vocab-search-input');
            const resultBox = document.getElementById('vocab-search-result');
            if (!input || !resultBox) return;

            const query = normalizeSearchText(input.value);
            resultBox.innerHTML = '';

            if (!query) {
                resultBox.classList.add('hidden');
                return;
            }

            const matches = allWords.filter(item => {
                const word = normalizeSearchText(item.word);
                const pinyin = normalizeSearchText(item.pinyin);
                const meaning = normalizeSearchText(item.meaning);
                return word.includes(query) || pinyin.includes(query) || meaning.includes(query);
            });

            resultBox.classList.remove('hidden');

            if (matches.length === 0) {
                resultBox.innerHTML = '<div style="padding:18px; text-align:center; color:var(--gray); background:var(--bg); border-radius:14px;">검색 결과가 없어요 🥲</div>';
                return;
            }

            const header = document.createElement('div');
            header.style.cssText = 'font-size:13px; color:var(--gray); margin:0 2px 8px;';
            header.textContent = `검색 결과 ${matches.length}개`;
            resultBox.appendChild(header);

            matches.forEach(item => {
                const row = document.createElement('div');
                row.style.cssText = 'background:white; border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;';

                const info = document.createElement('div');
                info.style.cssText = 'min-width:0; flex:1;';

                const wordLine = document.createElement('div');
                wordLine.style.cssText = 'display:flex; align-items:baseline; gap:8px; margin-bottom:4px;';
                const word = document.createElement('span');
                word.style.cssText = 'font-size:19px; font-weight:800; color:var(--text);';
                word.textContent = item.word;
                const pinyin = document.createElement('span');
                pinyin.style.cssText = 'font-size:12px; color:var(--primary); font-weight:600;';
                pinyin.textContent = item.pinyin || '';
                wordLine.append(word, pinyin);

                const meaning = document.createElement('div');
                meaning.style.cssText = 'font-size:13px; color:var(--text); line-height:1.4;';
                meaning.textContent = item.meaning || '';

                const day = document.createElement('div');
                day.style.cssText = 'flex-shrink:0; background:var(--primary-light); color:var(--primary); font-size:11px; padding:5px 8px; border-radius:8px; font-weight:700;';
                day.textContent = `Day ${Math.floor(allWords.indexOf(item) / CHUNK_SIZE) + 1}`;

                info.append(wordLine, meaning);
                row.append(info, day);
                resultBox.appendChild(row);
            });
        }

        function clearVocabSearch() {
            const input = document.getElementById('vocab-search-input');
            if (input) {
                input.value = '';
                input.focus();
            }
            searchVocabWords();
        }

        async function openVocbDays() {
            if (!allWords || allWords.length === 0) {
                await loadWordsData();
            }
            showScreen('screen-vocab-days');
            const grid = document.getElementById('day-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const searchInput = document.getElementById('vocab-search-input');
            if (searchInput && !searchInput.dataset.bound) {
                searchInput.addEventListener('input', searchVocabWords);
                searchInput.dataset.bound = 'true';
            }
            if (searchInput) searchInput.value = '';
            const searchResult = document.getElementById('vocab-search-result');
            if (searchResult) { searchResult.innerHTML = ''; searchResult.classList.add('hidden'); }

            // 퀴즈의 범위 선택과 동일하게 전체 Day를 시작/종료 범위로 선택할 수 있습니다.
            const totalDays = Math.ceil(allWords.length / CHUNK_SIZE) || 1;
            const rangeStart = document.getElementById('vocab-range-start-day');
            const rangeEnd = document.getElementById('vocab-range-end-day');
            if (rangeStart && rangeEnd) {
                const prevStart = parseInt(rangeStart.value) || 1;
                const prevEnd = parseInt(rangeEnd.value) || Math.min(1, totalDays);
                rangeStart.innerHTML = '';
                rangeEnd.innerHTML = '';
                for (let d = 1; d <= totalDays; d++) {
                    rangeStart.add(new Option(`Day ${d}`, d));
                    rangeEnd.add(new Option(`Day ${d}`, d));
                }
                rangeStart.value = String(Math.min(Math.max(prevStart, 1), totalDays));
                rangeEnd.value = String(Math.min(Math.max(prevEnd, 1), totalDays));
                if (parseInt(rangeStart.value) > parseInt(rangeEnd.value)) rangeEnd.value = rangeStart.value;
            }
            
            
            for (let i = 0; i < totalDays; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min((i + 1) * CHUNK_SIZE, allWords.length);
                const dayNum = i + 1;
                
                let dayWords = allWords.slice(start, end);
                let learnedCount = dayWords.filter(w => (wordStatuses[w.word_id] || 0) === 1).length;
                let percent = dayWords.length > 0 ? Math.round((learnedCount / dayWords.length) * 100) : 0;

                const btn = document.createElement('div');
                btn.className = 'day-card';
                const completedDays = JSON.parse(localStorage.getItem('hsk_completed_days') || '{}');
                const isCompleted = completedDays[dayNum] === true;
                btn.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px; padding-right:55px;">
                        <input type="checkbox" class="day-complete-checkbox" data-day="${dayNum}" ${isCompleted ? 'checked' : ''} aria-label="Day ${dayNum} 학습 완료">
                        <span>Day ${dayNum}</span>
                    </div>
                    <div style="position: absolute; right: 12px; top: 12px; background: var(--primary-light); color: var(--primary); font-size: 12px; padding: 4px 8px; border-radius: 8px; font-weight: 400;">${percent}%</div>
                `;

                const checkbox = btn.querySelector('.day-complete-checkbox');
                checkbox.addEventListener('click', (event) => event.stopPropagation());
                checkbox.addEventListener('change', (event) => {
                    const completed = JSON.parse(localStorage.getItem('hsk_completed_days') || '{}');
                    completed[dayNum] = event.target.checked;
                    localStorage.setItem('hsk_completed_days', JSON.stringify(completed));
                });

                btn.onclick = (event) => {
                    if (event.target.closest('.day-complete-checkbox')) return;
                    selectVocbDay(start, end, dayNum);
                };
                grid.appendChild(btn);
            }
        }

      function selectVocbDay(startIdx, endIdx, dayNum) {
            selectedStartIdx = startIdx;
            selectedEndIdx = endIdx;
            selectedDayNum = dayNum;
            
            showScreen('screen-vocab-day-detail');
            const titleEl = document.getElementById('day-detail-title');
            if (titleEl) titleEl.innerText = `Day ${dayNum} 단어 목록`;
            
            const listContainer = document.getElementById('day-words-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            
            const dayWords = allWords.slice(startIdx, endIdx);
            dayWords.forEach((item, idx) => {
                const status = wordStatuses[item.word_id] || 0;
                let statusEmoji = status === 1 ? '🟤' : status === 2 ? '🟠' : '⚪';
                
                // ✅ 누적 번호 계산 (0001부터 0800까지 연속 상승)
                const globalNum = String(startIdx + idx + 1).padStart(4, '0');
                
                const card = document.createElement('div');
                // ✅ 기존 코드에 position: relative; 만 추가하여 뜻 위치/간격 완벽 유지
                card.style.cssText = "background:var(--card-bg); border:1px solid var(--border); padding:20px 16px; border-radius:14px; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-sm); position:relative;";
                
                card.innerHTML = `
                    <!-- 1. 왼쪽 상단 단어 번호 -->
                    <div style="position:absolute; top:6px; left:9px; font-size:11px; color:var(--gray); font-weight:600;">${globalNum}</div>
                    
                    <!-- 2. 기존 단어/병음 영역 -->
                    <div style="display:flex; flex-direction:column; gap:3px; min-width: 100px; cursor:pointer; transform: translateX(-3px)" onclick="openWordCard(${startIdx}, ${endIdx}, ${idx})">
                        <span style="font-size:24px; font-weight:800; color:var(--text); transform: translateX(-15px); transform: translateY(8px);">${item.word}</span>
                        <span style="font-size:12px; color:var(--primary); font-weight:400; transform: translateX(-15px); transform: translateY(7px)">${item.pinyin}</span>
                    </div>
                    
                    <!-- 3. 기존 뜻 영역 -->
                    <div style="flex:1; text-align:left; padding:0 12px; font-size:15px; font-weight:600; color:var(--text); word-break:break-all; cursor:pointer; transform: translateX(-15px);" onclick="openWordCard(${startIdx}, ${endIdx}, ${idx})">${item.meaning}</div>
                    
                    <!-- 4. 중앙 레이아웃 틀어짐 방지를 위한 기존 여백(20px) 그대로 유지 -->
                    <div style="min-width: 20px;"></div>
                    
                    <!-- 5. 상태 동그라미 (오른쪽 상단으로 이동) -->
                    <div style="position:absolute; top:6px; right:9px;">
                        <span id="list-status-${item.word_id}" style="font-size:13.6px; cursor:pointer; padding: 2px;" title="상태 변경" onclick="toggleListWordStatus(${item.word_id}, event)">${statusEmoji}</span>
                    </div>
                    
                    <!-- 6. 스피커 아이콘 (오른쪽 중앙~하단 배치 및 발음 듣기 기능) -->
                    <div style="position:absolute; bottom:15px; right:12px;">
                        <span style="font-size:15px; cursor:pointer; padding: 2px;" title="발음 듣기" onclick="event.stopPropagation(); speakChinese('${item.word}');">🔊</span>
                    </div>
                `;

                listContainer.appendChild(card);
            });
        }

        function toggleListWordStatus(wordId, event) {
            event.stopPropagation();
            let currentStatus = wordStatuses[wordId] || 0;
            let nextStatus = (currentStatus + 1) % 3;
            if (nextStatus === 0) delete wordStatuses[wordId];
            else wordStatuses[wordId] = nextStatus;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
            
            const badge = document.getElementById(`list-status-${wordId}`);
            if (badge) {
                badge.innerText = nextStatus === 1 ? '🟤' : nextStatus === 2 ? '🟠' : '⚪';
            }
        }

        function startRangeVocabSession() {
            const startDay = parseInt(document.getElementById('vocab-range-start-day').value);
            const endDay = parseInt(document.getElementById('vocab-range-end-day').value);
            if (startDay > endDay) {
                alert("시작 Day가 종료 Day보다 클 수 없습니다.");
                return;
            }

            const checkedStatuses = Array.from(document.querySelectorAll('input[name="vocab-range-status"]:checked')).map(el => parseInt(el.value));
            if (checkedStatuses.length === 0) {
                alert("최소 하나 이상의 상태를 선택해주세요.");
                return;
            }

            let list = allWords.slice((startDay - 1) * CHUNK_SIZE, endDay * CHUNK_SIZE).filter(w => {
                const status = wordStatuses[w.word_id] || 0;
                return checkedStatuses.includes(status);
            });

            if (list.length === 0) {
                alert("해당 조건에 부합하는 단어가 없습니다.");
                return;
            }

            const mode = document.querySelector('input[name="vocab-range-order"]:checked').value;
            if (mode === 'random') list = shuffle(list);

            isRangeVocabMode = true;
            selectedStartIdx = (startDay - 1) * CHUNK_SIZE;
            selectedEndIdx = Math.min(endDay * CHUNK_SIZE, allWords.length);
            selectedDayNum = `${startDay}~${endDay}`;
            currentList = list;
            currentVocbWrongItems = [];
            currentVocbCorrectCount = 0;
            currentIndex = 0;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function openWordCard(startIdx, endIdx, idx) {
            isRangeVocabMode = false;
            isDirectStudyMode = true;
            currentList = allWords.slice(startIdx, endIdx);
            currentVocbWrongItems = [];
            currentIndex = idx;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function openVocbOptions() {
            isRangeVocabMode = false;
            isDirectStudyMode = false;
            showScreen('screen-vocab-options');
        }

        function startVocabSessionFromOptions() {
            isRangeVocabMode = false;
            isDirectStudyMode = false;
            let list = allWords.slice(selectedStartIdx, selectedEndIdx);
            
            const checkedStatuses = Array.from(document.querySelectorAll('input[name="vocab-status"]:checked')).map(el => parseInt(el.value));
            if (checkedStatuses.length === 0) {
                alert("최소 하나 이상의 상태를 선택해주세요.");
                return;
            }
            list = list.filter(w => checkedStatuses.includes(wordStatuses[w.word_id] || 0));

            if (list.length === 0) {
                alert("해당 조건에 부합하는 단어가 없습니다.");
                return;
            }

            const mode = document.querySelector('input[name="vocab-mode"]:checked').value;
            if (mode === 'random') list = shuffle(list);

            currentList = list;
            currentVocbWrongItems = [];
            currentVocbCorrectCount = 0;
            currentIndex = 0;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function restartVocbSession(onlyWrong) {
            if (onlyWrong) {
                if (currentVocbWrongItems.length === 0) {
                    alert("틀린 단어가 없습니다!");
                    return;
                }
                currentList = shuffle([...currentVocbWrongItems]);
            } else if (isRangeVocabMode) {
                let list = allWords.slice(selectedStartIdx, selectedEndIdx);
                const checkedStatuses = Array.from(document.querySelectorAll('input[name="vocab-range-status"]:checked')).map(el => parseInt(el.value));
                list = list.filter(w => checkedStatuses.includes(wordStatuses[w.word_id] || 0));
                if (document.querySelector('input[name="vocab-range-order"]:checked').value === 'random') {
                    list = shuffle(list);
                }
                if (list.length === 0) {
                    alert("해당 조건에 부합하는 단어가 없습니다.");
                    return;
                }
                currentList = list;
            } else {
                let list = allWords.slice(selectedStartIdx, selectedEndIdx);
                const checkedStatuses = Array.from(document.querySelectorAll('input[name="vocab-status"]:checked')).map(el => parseInt(el.value));
                list = list.filter(w => checkedStatuses.includes(wordStatuses[w.word_id] || 0));
                
                if (document.querySelector('input[name="vocab-mode"]:checked').value === 'random') {
                    list = shuffle(list);
                }
                currentList = list;
            }
            currentVocbWrongItems = [];
            currentVocbCorrectCount = 0;
            currentIndex = 0;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function cycleWordStatus() {
            const item = currentList[currentIndex];
            let currentStatus = wordStatuses[item.word_id] || 0;
            let nextStatus = (currentStatus + 1) % 3;
            if (nextStatus === 0) delete wordStatuses[item.word_id];
            else wordStatuses[item.word_id] = nextStatus;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
            updateStatusBadge(nextStatus);
        }

        function updateStatusBadge(status) {
            const badge = document.getElementById('vc-status-badge');
            if (!badge) return;
            if (status === 1) { badge.innerText = '🟤'; badge.style.background = '#f5ece6'; }
            else if (status === 2) { badge.innerText = '🟠'; badge.style.background = 'var(--warning-light)'; }
            else { badge.innerText = '⚪'; badge.style.background = 'var(--bg)'; }
        }

        function showVocabCard() {
            if (currentIndex >= currentList.length) {
                showScreen('screen-vocab-result');
                const totalCount = currentList.length;
                const percent = totalCount > 0 ? Math.round((currentVocbCorrectCount / totalCount) * 100) : 0;
                document.getElementById('vocab-result-score').innerText = `${percent}%`;
                document.getElementById('vocab-result-desc').innerText = `${currentVocbCorrectCount} / ${totalCount}`;
                const retryWrongBtn = document.getElementById('btn-vocab-retry-wrong');
                if (retryWrongBtn) retryWrongBtn.style.display = currentVocbWrongItems.length === 0 ? 'none' : 'block';
                return;
            }
            const item = currentList[currentIndex];
            document.getElementById('vc-word').innerText = item.word;
            document.getElementById('vc-word-back').innerText = item.word;
            document.getElementById('vc-pinyin').innerText = item.pinyin;
            document.getElementById('vc-meaning').innerText = item.meaning;
            
            updateStatusBadge(wordStatuses[item.word_id] || 0);
            
            const exBox = document.getElementById('vc-example-box');
            if (item.example_zh) {
                exBox.style.display = 'block';
                document.getElementById('vc-ex-zh').innerHTML = item.example_zh.split(item.word).join(`<span class="highlight-word">${item.word}</span>`);
                document.getElementById('vc-ex-py').innerText = item.example_pinyin;
                document.getElementById('vc-ex-ko').innerText = item.example_ko;
            } else {
                exBox.style.display = 'none';
            }

            document.getElementById('vocab-progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            const percent = ((currentIndex + 1) / currentList.length) * 100;
            document.getElementById('vocab-progress-bar').style.width = `${percent}%`;

            const studyBtnGroup = document.getElementById('vocab-study-btn-group');
            const navBtnGroup = document.getElementById('vocab-nav-btn-group');

            if (isDirectStudyMode) {
                studyBtnGroup.classList.add('hidden');
                navBtnGroup.innerHTML = `
                    <button class="btn-secondary" onclick="prevVocbCard()" style="flex:1; padding: 18px; background: var(--text); color: white; border-radius: 14px;">◀ 이전 단어</button>
                    <button class="btn-secondary" onclick="nextVocbCardModal()" style="flex:1; padding: 18px; background: var(--text); color: white; border-radius: 14px;">다음 단어 ▶</button>
                `;
            } else {
                studyBtnGroup.classList.remove('hidden');
                navBtnGroup.innerHTML = `
                    <button class="btn-secondary" onclick="prevVocbCard()" style="width: 100%;">◀ 이전 단어</button>
                `;
            }

            isFlipped = false;
            document.getElementById('vc-back').classList.add('hidden');
            document.getElementById('vc-front-content').classList.remove('hidden');
        }

        function toggleCardFront() {
            isFlipped = !isFlipped;
            const back = document.getElementById('vc-back'), front = document.getElementById('vc-front-content');
            if (isFlipped) { front.classList.add('hidden'); back.classList.remove('hidden'); }
            else { back.classList.add('hidden'); front.classList.remove('hidden'); }
        }

        function prevVocbCard() {
            if (currentIndex > 0) { currentIndex--; showVocabCard(); }
            else alert("첫 번째 단어입니다.");
        }

        function nextVocbCardModal() {
            if (currentIndex < currentList.length - 1) { currentIndex++; showVocabCard(); }
            else alert("마지막 단어입니다.");
        }

        function markVocbResult(isKnown) {
            const item = currentList[currentIndex];
            // 단어장학습의 자기평가도 정답/오답 기록에 반영합니다.
            // '외웠어요' = 정답, '헷갈려요' = 오답으로 누적되어 자동 상태가 계산됩니다.
            recordWordResult(item.word_id, isKnown);
            if (isKnown) currentVocbCorrectCount++;

            if (!isKnown) {
                if (!wrongWordIds.includes(item.word_id)) {
                    wrongWordIds.push(item.word_id);
                    localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds));
                }
                if (!currentVocbWrongItems.find(w => w.word_id === item.word_id)) {
                    currentVocbWrongItems.push(item);
                }
            }
            currentIndex++;
            showVocabCard();
        }

        async function selectQuizType(type) {
            if (!allWords || allWords.length === 0) await loadWordsData();
            currentQuizType = type;
            showScreen('screen-quiz-settings');
            
            const startSelect = document.getElementById('quiz-start-day');
            const endSelect = document.getElementById('quiz-end-day');
            if (!startSelect || !endSelect) return;
            startSelect.innerHTML = ''; endSelect.innerHTML = '';
            
            const totalDays = Math.ceil(allWords.length / CHUNK_SIZE) || 1;
            for (let i = 1; i <= totalDays; i++) {
                startSelect.add(new Option(`Day ${i}`, i));
                let optEnd = new Option(`Day ${i}`, i);
                if (i === totalDays) optEnd.selected = true;
                endSelect.add(optEnd);
            }
        }

        async function openQuizMenu() {
            if (!allWords || allWords.length === 0) await loadWordsData();
            showScreen('screen-quiz-menu');
        }

        function startQuizAction() {
            const startDay = parseInt(document.getElementById('quiz-start-day').value);
            const endDay = parseInt(document.getElementById('quiz-end-day').value);
            if (startDay > endDay) { alert("시작 Day가 종료 Day보다 클 수 없습니다."); return; }

            const checkedStatuses = Array.from(document.querySelectorAll('input[name="quiz-status"]:checked')).map(el => parseInt(el.value));
            if (checkedStatuses.length === 0) { alert("최소 하나 이상의 상태를 선택해주세요."); return; }

            // 2. 모름(0)인 단어도 정상적으로 퀴즈에 필터링되어 불러와지도록 수정
            let targetWords = allWords.slice((startDay - 1) * CHUNK_SIZE, endDay * CHUNK_SIZE).filter(w => {
                const status = wordStatuses[w.word_id] || 0;
                return checkedStatuses.includes(status);
            });

            if (targetWords.length === 0) { alert("조건에 일치하는 단어가 없습니다."); return; }

            if (document.querySelector('input[name="quiz-order"]:checked').value === 'random') targetWords = shuffle(targetWords);

            originalQuizList = [...targetWords];
            currentList = [...originalQuizList];
            currentQuizWrongItems = [];
            currentIndex = 0; score = 0;
            showScreen('screen-quiz-play');
            loadQuizQuestion();
        }
        
        function retryQuiz(onlyWrong) {
            if (onlyWrong) {
                if (currentQuizWrongItems.length === 0) { alert("틀린 문제가 없습니다!"); return; }
                currentList = shuffle([...currentQuizWrongItems]);
            } else {
                currentList = shuffle([...originalQuizList]);
            }
            currentQuizWrongItems = []; currentIndex = 0; score = 0;
            showScreen('screen-quiz-play');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentIndex >= currentList.length) { showFinalResult(score, currentList.length); return; }

            document.getElementById('quiz-post-actions-pre-expl').classList.add('hidden');
            document.getElementById('quiz-explanation-box').classList.add('hidden');

            const item = currentList[currentIndex];
            document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            const percent = ((currentIndex + 1) / currentList.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${percent}%`;

            const quizBox = document.getElementById('quiz-box');
            quizBox.style.background = 'var(--beige-box)'; quizBox.style.color = 'var(--text)';

            let activeType = currentQuizType;
            if (activeType === 'mix') {
                const types = ['blank', 'meaning', 'pinyin', 'writing'];
                activeType = types[Math.floor(Math.random() * types.length)];
            }

            const optionsBox = document.getElementById('quiz-options');
            const writingBox = document.getElementById('quiz-writing-box');
            optionsBox.innerHTML = ''; writingBox.classList.add('hidden');

            let typeLabel = '';
            if (activeType === 'blank') {
                typeLabel = '📝 예문 빈칸 채우기';
                let rawSentence = item.example_zh || item.word;
                let highlightedSentence = rawSentence.split(item.word).join(`<span class="highlight-word">_____</span>`);
                
                quizBox.innerHTML = `
                    <div style="font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.4;">${highlightedSentence}</div>
                    <div style="font-size: 13px; font-weight: 500; color: var(--gray);">${item.example_ko || item.meaning}</div>
                `;
                renderChoiceOptions(item.word, 'word');
            } else if (activeType === 'meaning') {
                typeLabel = '🇰🇷 뜻 보고 맞히기';
                quizBox.innerHTML = `<div>${item.meaning}</div>`;
                renderChoiceOptions(item.word, 'word');
            } else if (activeType === 'pinyin') {
                typeLabel = '🎵 성조 맞히기';
                quizBox.innerHTML = `<div style="font-size:32px; font-weight:800;">${item.word}</div>`;
                renderChoiceOptions(item.pinyin, 'pinyin');
            } else if (activeType === 'writing') {
                typeLabel = '✍️ 쓰기';
                quizBox.innerHTML = `<div>${item.meaning}</div>`;
                writingBox.classList.remove('hidden');
                document.getElementById('quiz-input').value = '';
                setTimeout(() => document.getElementById('quiz-input').focus(), 50);
            }
            document.getElementById('quiz-type-label').innerText = typeLabel;
        }

        function renderChoiceOptions(correctAnswer, poolKey) {
            const optionsBox = document.getElementById('quiz-options');
            // 선택한 퀴즈 범위(currentList) 안에서만 오답 보기를 생성합니다.
            const sourcePool = currentList && currentList.length > 0 ? currentList : allWords;
            let incorrects = sourcePool.filter(w => w[poolKey] !== correctAnswer);
            incorrects = shuffle(incorrects).slice(0, 3);
            let choices = shuffle([...incorrects.map(w => w[poolKey]), correctAnswer]);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt-btn'; btn.innerText = choice;
                btn.onclick = () => checkQuizAnswer(btn, choice, correctAnswer, currentList[currentIndex]);
                optionsBox.appendChild(btn);
            });
        }

        function checkQuizAnswer(clickedBtn, selected, correct, item) {
            const buttons = document.querySelectorAll('.quiz-opt-btn');
            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = selected === correct;
            // 문제를 풀 때마다 해당 단어의 누적 정답률과 상태를 자동 갱신합니다.
            recordWordResult(item.word_id, isCorrect);

            if (isCorrect) {
                score++; clickedBtn.classList.add('btn-correct');
            } else {
                clickedBtn.classList.add('btn-wrong');
                buttons.forEach(btn => { if (btn.innerText === correct) btn.classList.add('btn-correct'); });
                if (!wrongWordIds.includes(item.word_id)) { wrongWordIds.push(item.word_id); localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds)); }
                if (!currentQuizWrongItems.find(w => w.word_id === item.word_id)) currentQuizWrongItems.push(item);
            }
            document.getElementById('quiz-post-actions-pre-expl').classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadWordsData();
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const writingBox = document.getElementById('quiz-writing-box');
                    if (writingBox && !writingBox.classList.contains('hidden')) {
                        submitWritingAnswer();
                    }
                }
            });
        });

        function submitWritingAnswer() {
            const item = currentList[currentIndex];
            const userInput = document.getElementById('quiz-input').value.trim();
            document.getElementById('quiz-writing-box').classList.add('hidden');
            const quizBox = document.getElementById('quiz-box');
            
            const isCorrect = userInput === item.word;
            // 쓰기 문제도 동일하게 단어별 누적 정답률에 반영합니다.
            recordWordResult(item.word_id, isCorrect);

            if (isCorrect) {
                score++;
                quizBox.style.background = '#eaf2ea'; quizBox.style.color = '#2d5a27';
                quizBox.innerHTML = `
                    <div>${item.meaning}</div>
                    <div style="font-size:30px; font-weight:800; margin-top: 8px;">${item.word}</div>
                    <div style="font-size:14px; color:var(--primary); font-weight:700; margin-top:4px;">${item.pinyin}</div>
                `;
            } else {
                quizBox.style.background = 'var(--danger-light)'; quizBox.style.color = 'var(--danger)';
                quizBox.innerHTML = `
                    <div style="font-size:12px; color:var(--text); font-weight:600; margin-bottom:6px;">오답: ${userInput || '없음'}</div>
                    <div>${item.meaning}</div>
                    <div style="font-size:30px; font-weight:800; margin-top: 6px;">${item.word}</div>
                    <div style="font-size:14px; color:var(--primary); font-weight:700; margin-top:4px;">${item.pinyin}</div>
                `;
                if (!wrongWordIds.includes(item.word_id)) { wrongWordIds.push(item.word_id); localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds)); }
                if (!currentQuizWrongItems.find(w => w.word_id === item.word_id)) currentQuizWrongItems.push(item);
            }
            document.getElementById('quiz-post-actions-pre-expl').classList.remove('hidden');
        }

        function showQuizExplanation() {
            const item = currentList[currentIndex];
            document.getElementById('qz-word-info').innerText = `${item.word} [${item.pinyin}] - ${item.meaning}`;
            
            let highlightedEx = item.example_zh ? item.example_zh.split(item.word).join(`<span class="highlight-word">${item.word}</span>`) : '';
            document.getElementById('qz-ex-zh').innerHTML = highlightedEx;
            
            document.getElementById('qz-ex-py').innerText = item.example_pinyin || '';
            document.getElementById('qz-ex-ko').innerText = item.example_ko || '';
            
            document.getElementById('quiz-post-actions-pre-expl').classList.add('hidden');
            document.getElementById('quiz-explanation-box').classList.remove('hidden');

            setTimeout(() => {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function prevQuizQuestion() { if (currentIndex > 0) { currentIndex--; loadQuizQuestion(); } else alert("첫 번째 문제입니다."); }
        function nextQuizQuestion() { currentIndex++; loadQuizQuestion(); }

        async function openReview() {
            if (!allWords || allWords.length === 0) await loadWordsData();
            showScreen('screen-review');
            wrongWordIds = JSON.parse(localStorage.getItem('hsk_wrong_words') || '[]');
            document.getElementById('review-result-box').classList.add('hidden');
            document.getElementById('review-empty-box').classList.add('hidden');
            document.getElementById('review-play-box').classList.add('hidden');

            if (wrongWordIds.length === 0) {
                document.getElementById('review-empty-box').classList.remove('hidden');
            } else {
                document.getElementById('review-play-box').classList.remove('hidden');
                reviewSessionWordIds = [...wrongWordIds];
                currentList = allWords.filter(w => reviewSessionWordIds.includes(w.word_id));
                currentIndex = 0;
                showReviewCard();
            }
        }

        function showReviewCard() {
            if (currentIndex >= currentList.length) {
                document.getElementById('review-play-box').classList.add('hidden');
                document.getElementById('review-result-box').classList.remove('hidden');
                const retryWrongBtn = document.getElementById('btn-review-retry-wrong');
                if (retryWrongBtn) retryWrongBtn.style.display = wrongWordIds.length === 0 ? 'none' : 'block';
                return;
            }
            const item = currentList[currentIndex];
            document.getElementById('rc-word').innerText = item.word;
            document.getElementById('rc-word-back').innerText = item.word;
            document.getElementById('rc-pinyin').innerText = item.pinyin;
            document.getElementById('rc-meaning').innerText = item.meaning;
            updateStatusBadge(wordStatuses[item.word_id] || 0);
            
            if (item.example_zh) {
                document.getElementById('rc-ex-zh').innerHTML = item.example_zh.split(item.word).join(`<span class="highlight-word">${item.word}</span>`);
            } else {
                document.getElementById('rc-ex-zh').innerHTML = '';
            }
            document.getElementById('rc-ex-py').innerText = item.example_pinyin || '';
            document.getElementById('rc-ex-ko').innerText = item.example_ko || '';
            document.getElementById('review-progress').innerText = `오답 복습 (${currentIndex + 1} / ${currentList.length})`;
            isFlipped = false;
            document.getElementById('rc-back').classList.add('hidden');
            document.getElementById('rc-front-content').classList.remove('hidden');
        }

        function restartReviewSession(onlyWrong) {
            wrongWordIds = JSON.parse(localStorage.getItem('hsk_wrong_words') || '[]');
            let ids;

            if (onlyWrong) {
                ids = [...wrongWordIds];
                if (ids.length === 0) {
                    alert('현재 틀린 단어가 없습니다!');
                    document.getElementById('btn-review-retry-wrong').style.display = 'none';
                    return;
                }
            } else {
                ids = reviewSessionWordIds.length > 0 ? [...reviewSessionWordIds] : [...wrongWordIds];
            }

            reviewSessionWordIds = [...ids];
            currentList = allWords.filter(w => ids.includes(w.word_id));
            currentIndex = 0;
            document.getElementById('review-result-box').classList.add('hidden');
            document.getElementById('review-play-box').classList.remove('hidden');
            showReviewCard();
        }

        function cycleWordStatus() {
            const item = currentList[currentIndex];
            let nextStatus = ((wordStatuses[item.word_id] || 0) + 1) % 3;
            if (nextStatus === 0) delete wordStatuses[item.word_id];
            else wordStatuses[item.word_id] = nextStatus;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
            updateStatusBadge(nextStatus);
        }

        function toggleReviewCard() {
            isFlipped = !isFlipped;
            const back = document.getElementById('rc-back'), front = document.getElementById('rc-front-content');
            if (isFlipped) { front.classList.add('hidden'); back.classList.remove('hidden'); }
            else { back.classList.add('hidden'); front.classList.remove('hidden'); }
        }

        function reviewAnswer(isKnown) {
            if (isKnown) {
                wrongWordIds = wrongWordIds.filter(id => id !== currentList[currentIndex].word_id);
                localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds));
            }
            currentIndex++;
            showReviewCard();
        }

        function prevReviewCard() {
            if (currentIndex > 0) {
                currentIndex--;
                showReviewCard();
            } else {
                alert("첫 번째 오답 단어입니다.");
            }
        }

        function showFinalResult(correctCount, totalCount) {
            showScreen('screen-result');
            document.getElementById('result-score').innerText = `${Math.round((correctCount / totalCount) * 100)}%`;
            document.getElementById('result-desc').innerText = `${correctCount} / ${totalCount}`;
            document.getElementById('btn-retry-wrong').style.display = currentQuizWrongItems.length === 0 ? 'none' : 'block';
        }

        function resetWrongWords() {
            if (confirm('오답노트를 초기화하시겠습니까?')) {
                localStorage.removeItem('hsk_wrong_words');
                localStorage.removeItem('hsk_word_statuses');
                localStorage.removeItem('hsk_word_accuracy');
                wrongWordIds = []; wordStatuses = {}; wordAccuracy = {};
                alert('초기화되었습니다.'); goHome();
            }
        }
    </script>
</body>
</html>
