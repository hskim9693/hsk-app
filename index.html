<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 4급 마스터</title>

    <!-- 📌 스마트폰 홈 화면 아이콘 설정 -->
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22HSK%204%EA%B8%89%20%EB%A7%88%EC%8A%A4%ED%84%B0%22%2C%22short_name%22%3A%22HSK%204%EA%B8%89%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f9f6f0%22%2C%22theme_color%22%3A%22%238d5b4c%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22.%2Ficon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        :root {
            --primary: #8d5b4c;         
            --primary-light: #f5ece6;    
            --success: #588157;         
            --danger: #bc4749;          
            --danger-light: #fdf2f2;
            --warning: #dda15e;         
            --warning-light: #fef6ec;
            
            --bg: #f9f6f0;              
            --card-bg: #ffffff;         
            --text: #3d312a;            
            --gray: #8c7a6b;            
            --gray-light: #efebe4;      
            --border: #e2d9cd;          
            
            --shadow-sm: 0 4px 12px rgba(61, 49, 42, 0.04);
            --shadow-lg: 0 12px 32px rgba(61, 49, 42, 0.08);
        }
        
        body, div, span, button, input, select, h1, h2, h3 {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 600;
        
        }
        
        body {
            background: var(--bg);
            margin: 0;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            color: var(--text);
            line-height: 1.4;
        }
        
        .app-container {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 0;
        }
        .nav-btn:active { opacity: 0.5; }
        .nav-title { font-size: 17px; font-weight: 700; color: var(--text); }
        
        /* 📌 상단 프로그레스 바 스타일 */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-bottom: 10px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 3px;
        }

        .panel {
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 18px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 18px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:active { transform: scale(0.97); background: var(--gray-light); }
        .menu-btn span { font-size: 14px; color: var(--gray); font-weight: 500; }
        
        button {
            padding: 14px;
            font-size: 15px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
        }
        button:active { transform: scale(0.97); opacity: 0.9; }
        
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; width: 100%; }
        .btn-secondary { background: var(--gray-light); color: var(--text); width: 100%; }
        
        .btn-x { background: #3d312a; color: #ffffff; font-size: 20px; font-weight: 800; box-shadow: var(--shadow-sm); padding: 14px; }
        .btn-o { background: #ffffff; color: #3d312a; border: 1.5px solid var(--border); font-size: 20px; font-weight: 800; box-shadow: var(--shadow-sm); padding: 14px; }
        
        .day-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .day-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            padding: 20px 14px;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .day-card:active { transform: scale(0.95); background: var(--gray-light); }
        
        /* 📌 단어 카드 높이 최적화 (버튼이 한 화면에 잘 들어오도록 밸런스 조정) */
        .flashcard {
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            min-height: 330px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
        }
        
        .status-badge {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 2;
        }
        
        .word-lg { font-size: 42px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
        .back-side { display: flex; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
        
        .pinyin { font-size: 19px; color: var(--primary); margin-bottom: 4px; font-weight: 700; }
        .meaning { font-size: 18px; color: var(--text); margin-bottom: 10px; font-weight: 700; }
        
        .example-box {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            border: 1px solid var(--border);
        }
        
        .btn-group { display: flex; gap: 8px; width: 100%; margin-bottom: 6px; }
        .btn-group button { flex: 1; padding: 12px; font-weight: 800; }
        
        /* 📌 퀴즈 질문 박스 높이 축소 */
        .quiz-box { font-size: 18px; font-weight: 700; margin-bottom: 12px; padding: 18px 16px; background: var(--bg); border-radius: 14px; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px solid var(--border); }
        .quiz-options { display: flex; flex-direction: column; gap: 6px; }
        
        .quiz-opt-btn { background: var(--card-bg); color: var(--text); width: 100%; border: 1.5px solid var(--border); padding: 11px 14px; font-size: 15px; text-align: center; border-radius: 12px; font-weight: 600; }
        .btn-correct { background-color: var(--success) !important; color: white !important; }
        .btn-wrong { background-color: var(--danger) !important; color: white !important; }
        
        .control-group { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 12px 14px; border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
        .control-group label { font-size: 14px; font-weight: 700; color: var(--text); }
        .control-select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-size: 14px; font-weight: 600; outline: none; color: var(--text); }
        .radio-group { display: flex; gap: 14px; font-size: 13px; font-weight: 600; }
        
        .blank-text { color: var(--primary); font-weight: 800; letter-spacing: 2px; }
        .highlight-word { color: var(--danger); font-weight: 800; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 네비게이션 -->
        <div id="top-nav" class="top-nav hidden">
            <button class="nav-btn" onclick="goHome()">🏠 홈</button>
            <span id="nav-title" class="nav-title">학습</span>
            <button class="nav-btn" onclick="goSettings()">⚙️ 설정</button>
        </div>

        <!-- 1. 홈 화면 -->
        <div id="screen-home">
            <div class="panel" style="margin-bottom: 16px; padding: 24px 20px;">
                <h1 style="margin: 0 0 4px 0; font-size: 24px; color: var(--primary);">🇨🇳 HSK 4급</h1>
                <p style="margin: 0; color: var(--gray); font-size: 13px;">쭝국어 완벽 돌파 张陵赫我爱你</p>
            </div>
            <button class="menu-btn" onclick="openVocbDays()">📚 단어장 학습 <span>Day별 선택</span></button>
            <button class="menu-btn" onclick="openQuizMenu()">📝 퀴즈 <span>형식 선택 후 설정</span></button>
            <button class="menu-btn" onclick="openReview()">🔥 오답노트 <span>약점 집중 공략</span></button>
            <button class="menu-btn" onclick="goSettings()">⚙️ 설정 <span>데이터 관리</span></button>
        </div>

        <!-- 2. Day 선택 화면 -->
        <div id="screen-vocab-days" class="hidden">
            <div id="day-grid" class="day-grid"></div>
        </div>

        <!-- 2-1. Day 설정 화면 -->
        <div id="screen-vocab-options" class="hidden">
            <div class="panel" style="text-align: left; padding: 20px; margin-bottom: 16px;">
                <h3 id="vocab-option-title" style="margin:0 0 14px 0; font-size:18px; color: var(--primary);">Day 학습 설정</h3>
                <div class="control-group" style="margin-bottom: 10px;">
                    <label>학습 방식</label>
                    <div class="radio-group">
                        <label><input type="radio" name="vocab-mode" value="sequential" checked> 순차</label>
                        <label><input type="radio" name="vocab-mode" value="random"> 랜덤</label>
                    </div>
                </div>
                <div class="control-group" style="margin-bottom: 16px;">
                    <label>상태 필터</label>
                    <select id="vocab-status-filter" class="control-select">
                        <option value="all">전체 보기</option>
                        <option value="learned">🔵 외움</option>
                        <option value="confused">🟠 헷갈림</option>
                        <option value="unmarked">⚪ 미선택 (모름)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="startVocabSession()">학습 시작하기 🚀</button>
            </div>
            <button class="btn-secondary" onclick="openVocbDays()">◀ Day 다시 선택하기</button>
        </div>

        <!-- 3. 단어 카드 학습 화면 -->
        <div id="screen-vocab-card" class="hidden">
            <!-- 프로그레스 바 -->
            <div class="progress-bar-container">
                <div id="vocab-progress-bar" class="progress-bar-fill"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <button class="nav-btn" onclick="openVocbDays()" style="padding: 0; font-size: 13px;">◀ Day 선택으로</button>
                <div style="font-size:13px; font-weight:600; color:var(--gray);" id="vocab-progress">0 / 0</div>
            </div>

            <!-- 플래시카드 -->
            <div id="flashcard-elem" class="flashcard" onclick="toggleCardFront()">
                <div id="vc-status-badge" class="status-badge" onclick="event.stopPropagation(); cycleWordStatus();" title="상태 변경">⚪</div>
                
                <div id="vc-front-content" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div id="vc-word" class="word-lg"></div>
                    <button class="btn-secondary" onclick="event.stopPropagation(); speakChinese(currentList[currentIndex].word);" style="margin-top: 10px; padding: 8px 14px; font-size: 13px; width: auto;">🔊 단어 발음 듣기</button>
                </div>

                <div id="vc-back" class="back-side hidden">
                    <div id="vc-word-back" style="font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 2px;"></div>
                    <div id="vc-pinyin" class="pinyin"></div>
                    <div id="vc-meaning" class="meaning"></div>
                    
                    <div id="vc-example-box" class="example-box">
                        <div id="vc-ex-zh" style="margin-bottom:2px; font-weight:600; color:var(--text);"></div>
                        <div id="vc-ex-py" style="margin-bottom:2px; font-size:12px; color:var(--primary); font-weight: 500;"></div>
                        <div id="vc-ex-ko" style="color:var(--gray); font-weight: 500; margin-bottom: 6px;"></div>
                        <button class="btn-secondary" onclick="event.stopPropagation(); playExampleAudio(currentList[currentIndex]);" style="padding: 5px 10px; font-size: 11px; width: 100%;">🔊 예문 전체 듣기</button>
                    </div>
                </div>
            </div>

            <!-- 하단 OX 버튼 -->
            <div class="btn-group">
                <button class="btn-x" onclick="markVocabResult(false)">X</button>
                <button class="btn-o" onclick="markVocabResult(true)">O</button>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="prevVocbCard()">◀ 이전 단어</button>
            </div>
        </div>

        <!-- 3-1. 학습 완료 화면 -->
        <div id="screen-vocab-result" class="hidden">
            <div class="panel" style="padding: 28px 20px;">
                <h2 style="margin:0 0 8px 0; font-size: 22px; color: var(--primary);">단어 학습 완료! 🎉</h2>
                <p style="color: var(--gray); margin-bottom: 20px; font-size: 14px;">선택하신 단어 학습 세션을 모두 끝냈습니다.</p>
                <div class="btn-group" style="flex-direction: column; gap: 8px;">
                    <button class="btn-primary" onclick="restartVocbSession(false)">🔄 다시 학습하기</button>
                    <button id="btn-vocab-retry-wrong" class="btn-danger" onclick="restartVocbSession(true)">🔥 틀린 단어만 학습하기</button>
                    <button class="btn-secondary" onclick="goHome()">🏠 홈으로 돌아가기</button>
                </div>
            </div>
        </div>

        <!-- 4. 퀴즈 메뉴 화면 -->
        <div id="screen-quiz-menu" class="hidden">
            <div class="panel" style="text-align: left; padding: 18px; margin-bottom: 14px;">
                <h3 style="margin:0 0 10px 0; font-size:17px;">퀴즈 형식 선택</h3>
            </div>
            <button class="menu-btn" onclick="selectQuizType('mix')">🎲 종합 랜덤 퀴즈 <span>모든 유형 무작위 출제</span></button>
            <button class="menu-btn" onclick="selectQuizType('blank')">📝 예문 빈칸 채우기 <span>문맥 파악</span></button>
            <button class="menu-btn" onclick="selectQuizType('meaning')">🇰🇷 뜻 보고 맞히기 <span>의미 연상</span></button>
            <button class="menu-btn" onclick="selectQuizType('pinyin')">🎵 성조 맞히기 <span>발음 정확도</span></button>
            <button class="menu-btn" onclick="selectQuizType('writing')">✍️ 뜻 보고 직접 쓰기 <span>한자 출력</span></button>
        </div>

        <!-- 4-1. 퀴즈 설정 화면 -->
        <div id="screen-quiz-settings" class="hidden">
            <div class="panel" style="text-align: left; padding: 18px; margin-bottom: 14px;">
                <h3 id="quiz-setting-title" style="margin:0 0 12px 0; font-size:17px; color: var(--primary);">퀴즈 출제 설정</h3>
                
                <div class="control-group" style="margin-bottom: 10px;">
                    <label>문제 순서</label>
                    <div class="radio-group">
                        <label><input type="radio" name="quiz-order" value="sequential" checked> 순차</label>
                        <label><input type="radio" name="quiz-order" value="random"> 랜덤 섞기</label>
                    </div>
                </div>

                <div class="control-group" style="flex-direction: column; align-items: flex-start; gap: 8px; margin-bottom: 10px;">
                    <label>범위 지정</label>
                    <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
                        <select id="quiz-start-day" class="control-select" style="flex:1;"></select>
                        <span style="font-weight: 800; color: var(--border);">~</span>
                        <select id="quiz-end-day" class="control-select" style="flex:1;"></select>
                    </div>
                </div>

                <div class="control-group" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 0;">
                    <label>상태 선택</label>
                    <div class="radio-group" style="width: 100%; justify-content: space-between;">
                        <label><input type="checkbox" name="quiz-status" value="1" checked> 🔵 외움</label>
                        <label><input type="checkbox" name="quiz-status" value="2" checked> 🟠 헷갈림</label>
                        <label><input type="checkbox" name="quiz-status" value="0" checked> ⚪ 미선택</label>
                    </div>
                </div>
            </div>
            <button class="btn-primary" onclick="startQuizAction()" style="margin-bottom: 10px;">퀴즈 시작하기 🚀</button>
            <button class="btn-secondary" onclick="openQuizMenu()">◀ 형식 다시 선택하기</button>
        </div>

        <!-- 5. 퀴즈 진행 화면 -->
        <div id="screen-quiz-play" class="hidden">
            <!-- 프로그레스 바 -->
            <div class="progress-bar-container">
                <div id="quiz-progress-bar" class="progress-bar-fill"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <button class="nav-btn" onclick="openQuizMenu()" style="padding: 0; font-size: 13px;">◀ 퀴즈 설정으로</button>
                <div style="font-size:13px; font-weight:600; color:var(--gray);" id="quiz-progress">0 / 0</div>
            </div>
            <div class="panel" style="padding: 16px 14px;">
                <div id="quiz-type-label" style="font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 8px; text-transform: uppercase;"></div>
                <div id="quiz-box" class="quiz-box"></div>
                <div id="quiz-options" class="quiz-options"></div>

                <div id="quiz-writing-box" class="hidden" style="margin-top: 6px;">
                    <input type="text" id="quiz-input" placeholder="한자를 입력하세요" style="width: 100%; padding: 10px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 10px; text-align: center; box-sizing: border-box; outline: none; margin-bottom: 8px;" />
                    <button class="btn-primary" onclick="submitWritingAnswer()" style="padding: 12px;">정답 확인 ✍️</button>
                </div>
                
                <div id="quiz-post-actions" class="btn-group hidden" style="margin-top: 12px; flex-direction: column; gap: 8px;">
                    <button id="btn-show-expl" style="background:var(--text); color:white; padding: 10px;" onclick="showQuizExplanation()">📖 해설 보기</button>
                    <div style="display: flex; gap: 6px; width: 100%;">
                        <button class="btn-secondary" style="flex:1; padding: 10px;" onclick="prevQuizQuestion()">◀ 이전 문제</button>
                        <button class="btn-primary" style="flex:1; padding: 10px;" onclick="nextQuizQuestion()">다음 문제 ▶</button>
                    </div>
                </div>

                <div id="quiz-explanation-box" class="example-box hidden" style="margin-top: 10px; background: var(--primary-light); padding: 12px;">
                    <div id="qz-word-info" style="font-size: 15px; font-weight: 800; margin-bottom: 6px; border-bottom: 1.5px solid rgba(141, 91, 76, 0.2); padding-bottom: 6px; color: var(--primary);"></div>
                    <div id="qz-ex-zh" style="margin-bottom:2px; font-weight:700;"></div>
                    <div id="qz-ex-py" style="margin-bottom:4px; font-size:12px; color:var(--primary); font-weight:600;"></div>
                    <div id="qz-ex-ko" style="color:var(--text); font-weight:500; margin-bottom: 8px;"></div>
                    
                    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                        <button class="btn-secondary" onclick="speakChinese(currentList[currentIndex].word)" style="flex: 1; padding: 6px; font-size: 11px;">🔊 단어 발음</button>
                        <button class="btn-secondary" onclick="playExampleAudio(currentList[currentIndex])" style="flex: 1; padding: 6px; font-size: 11px;">🔊 예문 전체 듣기</button>
                    </div>
                    <button class="btn-primary" onclick="nextQuizQuestion()" style="padding: 10px;">다음 문제 ▶</button>
                </div>
            </div>
        </div>

        <!-- 6. 오답노트 화면 -->
        <div id="screen-review" class="hidden">
            <div class="panel" id="review-empty-box">

                { w: "苹果", p: "píngguǒ", m: "사과", exZh: " I 想吃苹果", exPy: "Wǒ xiǎng chī píngguǒ", exKo: "나는 사과를 먹고 싶다" },
                { w: "七", p: "qī", m: "일곱", exZh: "七点 见", exPy: "Qī diǎn jiàn", exKo: "7시에 보자" },
                { w: "钱", p: "qián", m: "돈", exZh: " I 有很多钱", exPy: "Wǒ yǒu hěn duō qián", exKo: "나는 돈이 아주 많다" },
                { w: "前面", p: "qiánmiàn", m: "앞쪽", exZh: " 앞에 사람이 있다", exPy: "Qiánmiàn yǒu rén", exKo: "앞쪽에 사람이 있다" }
            ];

            let poolIdx = 0;
            for (let i = 41; i <= 350; i++) {
                let currentItem = samplePool[poolIdx % samplePool.length];
                list.push({
                    word_id: i,
                    word: currentItem.w,
                    pinyin: currentItem.p,
                    meaning: currentItem.m,
                    example_zh: currentItem.exZh,
                    example_pinyin: currentItem.exPy,
                    example_ko: currentItem.exKo // 📌 자연스러운 해석 적용 완료
                });
                poolIdx++;
            }
            allWords = list;
        }

        function speakChinese(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function playExampleAudio(item) {
            if (item && item.example_zh) speakChinese(item.example_zh);
            else speakChinese(item.word);
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function showScreen(screenId) {
            const screens = ['screen-home', 'screen-vocab-days', 'screen-vocab-options', 'screen-vocab-card', 'screen-vocab-result', 'screen-quiz-menu', 'screen-quiz-settings', 'screen-quiz-play', 'screen-review', 'screen-settings', 'screen-result'];
            screens.forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');

            if (screenId === 'screen-home') {
                document.getElementById('top-nav').classList.add('hidden');
            } else {
                document.getElementById('top-nav').classList.remove('hidden');
                const titles = {
                    'screen-vocab-days': 'Day 선택', 'screen-vocab-options': '학습 설정', 'screen-vocab-card': '단어 암기', 'screen-vocab-result': '학습 완료',
                    'screen-quiz-menu': '퀴즈', 'screen-quiz-settings': '퀴즈 설정', 'screen-quiz-play': '퀴즈',
                    'screen-review': '오답 집중 훈련', 'screen-settings': '설정', 'screen-result': '결과 확인'
                };
                document.getElementById('nav-title').innerText = titles[screenId] || '';
            }
        }

        function goHome() { showScreen('screen-home'); }
        function goSettings() { showScreen('screen-settings'); }

        function openVocbDays() {
            if (!allWords || allWords.length === 0) initData();
            showScreen('screen-vocab-days');
            const grid = document.getElementById('day-grid');
            grid.innerHTML = '';
            
            const totalDays = Math.ceil(allWords.length / CHUNK_SIZE) || 1;
            for (let i = 0; i < totalDays; i++) {
                const start = i * CHUNK_SIZE + 1;
                const end = Math.min((i + 1) * CHUNK_SIZE, allWords.length);
                
                const btn = document.createElement('div');
                btn.className = 'day-card';
                btn.innerHTML = `Day ${i + 1}<div style="font-size:12px; color:var(--gray); margin-top:4px;">(${start} ~ ${end}번)</div>`;
                btn.onclick = () => selectVocabDay(i * CHUNK_SIZE, end, i + 1);
                grid.appendChild(btn);
            }
        }

        function selectVocabDay(startIdx, endIdx, dayNum) {
            selectedStartIdx = startIdx;
            selectedEndIdx = endIdx;
            document.getElementById('vocab-option-title').innerText = `Day ${dayNum} 학습 설정`;
            showScreen('screen-vocab-options');
        }

        function startVocabSession() {
            let list = allWords.slice(selectedStartIdx, selectedEndIdx);
            const filterVal = document.getElementById('vocab-status-filter').value;
            if (filterVal !== 'all') {
                let targetStatus = filterVal === 'learned' ? 1 : filterVal === 'confused' ? 2 : 0;
                list = list.filter(w => (wordStatuses[w.word_id] || 0) === targetStatus);
            }

            if (list.length === 0) {
                alert("해당 조건에 부합하는 단어가 없습니다.");
                return;
            }

            const mode = document.querySelector('input[name="vocab-mode"]:checked').value;
            if (mode === 'random') list = shuffle(list);

            currentList = list;
            currentVocbWrongItems = [];
            currentIndex = 0;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function restartVocbSession(onlyWrong) {
            if (onlyWrong) {
                if (currentVocbWrongItems.length === 0) {
                    alert("틀린 단어가 없습니다!");
                    return;
                }
                currentList = shuffle([...currentVocbWrongItems]);
            } else {
                let list = allWords.slice(selectedStartIdx, selectedEndIdx);
                const filterVal = document.getElementById('vocab-status-filter').value;
                if (filterVal !== 'all') {
                    let targetStatus = filterVal === 'learned' ? 1 : filterVal === 'confused' ? 2 : 0;
                    list = list.filter(w => (wordStatuses[w.word_id] || 0) === targetStatus);
                }
                if (document.querySelector('input[name="vocab-mode"]:checked').value === 'random') {
                    list = shuffle(list);
                }
                currentList = list;
            }
            currentVocbWrongItems = [];
            currentIndex = 0;
            showScreen('screen-vocab-card');
            showVocabCard();
        }

        function cycleWordStatus() {
            const item = currentList[currentIndex];
            let currentStatus = wordStatuses[item.word_id] || 0;
            let nextStatus = (currentStatus + 1) % 3;
            if (nextStatus === 0) delete wordStatuses[item.word_id];
            else wordStatuses[item.word_id] = nextStatus;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
            updateStatusBadge(nextStatus);
        }

        function updateStatusBadge(status) {
            const badge = document.getElementById('vc-status-badge');
            if (status === 1) { badge.innerText = '🔵'; badge.style.background = '#eaf2ea'; }
            else if (status === 2) { badge.innerText = '🟠'; badge.style.background = 'var(--warning-light)'; }
            else { badge.innerText = '⚪'; badge.style.background = 'var(--bg)'; }
        }

        function showVocabCard() {
            if (currentIndex >= currentList.length) {
                showScreen('screen-vocab-result');
                const retryWrongBtn = document.getElementById('btn-vocab-retry-wrong');
                retryWrongBtn.style.display = currentVocbWrongItems.length === 0 ? 'none' : 'block';
                return;
            }
            const item = currentList[currentIndex];
            document.getElementById('vc-word').innerText = item.word;
            document.getElementById('vc-word-back').innerText = item.word;
            document.getElementById('vc-pinyin').innerText = item.pinyin;
            document.getElementById('vc-meaning').innerText = item.meaning;
            
            updateStatusBadge(wordStatuses[item.word_id] || 0);
            
            const exBox = document.getElementById('vc-example-box');
            if (item.example_zh) {
                exBox.style.display = 'block';
                document.getElementById('vc-ex-zh').innerHTML = item.example_zh.split(item.word).join(`<span class="highlight-word">${item.word}</span>`);
                document.getElementById('vc-ex-py').innerText = item.example_pinyin;
                document.getElementById('vc-ex-ko').innerText = item.example_ko;
            } else {
                exBox.style.display = 'none';
            }

            document.getElementById('vocab-progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            const percent = ((currentIndex + 1) / currentList.length) * 100;
            document.getElementById('vocab-progress-bar').style.width = `${percent}%`;

            isFlipped = false;
            document.getElementById('vc-back').classList.add('hidden');
            document.getElementById('vc-front-content').classList.remove('hidden');
        }

        function toggleCardFront() {
            isFlipped = !isFlipped;
            const back = document.getElementById('vc-back');
            const front = document.getElementById('vc-front-content');
            if (isFlipped) { front.classList.add('hidden'); back.classList.remove('hidden'); }
            else { back.classList.add('hidden'); front.classList.remove('hidden'); }
        }

        function prevVocbCard() {
            if (currentIndex > 0) { currentIndex--; showVocabCard(); }
            else alert("첫 번째 단어입니다.");
        }

        function markVocabResult(isKnown) {
            const item = currentList[currentIndex];
            if (!isKnown) {
                if (!wrongWordIds.includes(item.word_id)) {
                    wrongWordIds.push(item.word_id);
                    localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds));
                }
                if (!currentVocbWrongItems.find(w => w.word_id === item.word_id)) {
                    currentVocbWrongItems.push(item);
                }
            }
            currentIndex++;
            showVocabCard();
        }

        function selectQuizType(type) {
            if (!allWords || allWords.length === 0) initData();
            currentQuizType = type;
            showScreen('screen-quiz-settings');
            
            const startSelect = document.getElementById('quiz-start-day');
            const endSelect = document.getElementById('quiz-end-day');
            startSelect.innerHTML = ''; endSelect.innerHTML = '';
            
            const totalDays = Math.ceil(allWords.length / CHUNK_SIZE) || 1;
            for (let i = 1; i <= totalDays; i++) {
                startSelect.add(new Option(`Day ${i}`, i));
                let optEnd = new Option(`Day ${i}`, i);
                if (i === totalDays) optEnd.selected = true;
                endSelect.add(optEnd);
            }
        }

        function openQuizMenu() {
            if (!allWords || allWords.length === 0) initData();
            showScreen('screen-quiz-menu');
        }

        function startQuizAction() {
            const startDay = parseInt(document.getElementById('quiz-start-day').value);
            const endDay = parseInt(document.getElementById('quiz-end-day').value);
            if (startDay > endDay) { alert("시작 Day가 종료 Day보다 클 수 없습니다."); return; }

            const checkedStatuses = Array.from(document.querySelectorAll('input[name="quiz-status"]:checked')).map(el => parseInt(el.value));
            if (checkedStatuses.length === 0) { alert("최소 하나 이상의 상태를 선택해주세요."); return; }

            let targetWords = allWords.slice((startDay - 1) * CHUNK_SIZE, endDay * CHUNK_SIZE).filter(w => checkedStatuses.includes(wordStatuses[w.word_id] || 0));
            if (targetWords.length === 0) { alert("조건에 일치하는 단어가 없습니다."); return; }

            if (document.querySelector('input[name="quiz-order"]:checked').value === 'random') targetWords = shuffle(targetWords);

            originalQuizList = [...targetWords];
            currentList = [...originalQuizList];
            currentQuizWrongItems = [];
            currentIndex = 0; score = 0;
            showScreen('screen-quiz-play');
            loadQuizQuestion();
        }
        
        function retryQuiz(onlyWrong) {
            if (onlyWrong) {
                if (currentQuizWrongItems.length === 0) { alert("틀린 문제가 없습니다!"); return; }
                currentList = shuffle([...currentQuizWrongItems]);
            } else {
                currentList = shuffle([...originalQuizList]);
            }
            currentQuizWrongItems = []; currentIndex = 0; score = 0;
            showScreen('screen-quiz-play');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            if (currentIndex >= currentList.length) { showFinalResult(score, currentList.length); return; }

            document.getElementById('quiz-post-actions').classList.add('hidden');
            document.getElementById('quiz-explanation-box').classList.add('hidden');
            document.getElementById('btn-show-expl').classList.remove('hidden');

            const item = currentList[currentIndex];
            document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${currentList.length}`;
            
            const percent = ((currentIndex + 1) / currentList.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${percent}%`;

            const quizBox = document.getElementById('quiz-box');
            quizBox.style.background = 'var(--bg)'; quizBox.style.color = 'var(--text)';

            let activeType = currentQuizType;
            if (activeType === 'mix') {
                const types = ['blank', 'meaning', 'pinyin', 'writing'];
                activeType = types[Math.floor(Math.random() * types.length)];
            }

            const optionsBox = document.getElementById('quiz-options');
            const writingBox = document.getElementById('quiz-writing-box');
            optionsBox.innerHTML = ''; writingBox.classList.add('hidden');

            let typeLabel = '';
            if (activeType === 'blank') {
                typeLabel = '📝 예문 빈칸 채우기';
                quizBox.innerHTML = `<div>${(item.example_zh || item.word).split(item.word).join('<span class="blank-text">_____</span>')}<br><span style="font-size:13px; color:var(--gray);">${item.example_ko || item.meaning}</span></div>`;
                renderChoiceOptions(item.word, 'word');
            } else if (activeType === 'meaning') {
                typeLabel = '🇰🇷 뜻 보고 맞히기';
                quizBox.innerHTML = `<div>${item.meaning}</div>`;
                renderChoiceOptions(item.word, 'word');
            } else if (activeType === 'pinyin') {
                typeLabel = '🎵 성조 맞히기';
                quizBox.innerHTML = `<div style="font-size:30px; font-weight:800;">${item.word}</div>`;
                renderChoiceOptions(item.pinyin, 'pinyin');
            } else if (activeType === 'writing') {
                typeLabel = '✍️ 뜻 보고 직접 쓰기';
                quizBox.innerHTML = `<div>${item.meaning}</div>`;
                writingBox.classList.remove('hidden');
                document.getElementById('quiz-input').value = '';
            }
            document.getElementById('quiz-type-label').innerText = typeLabel;
        }

        function renderChoiceOptions(correctAnswer, poolKey) {
            const optionsBox = document.getElementById('quiz-options');
            let incorrects = allWords.filter(w => w[poolKey] !== correctAnswer);
            incorrects = shuffle(incorrects).slice(0, 3);
            let choices = shuffle([...incorrects.map(w => w[poolKey]), correctAnswer]);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt-btn'; btn.innerText = choice;
                btn.onclick = () => checkQuizAnswer(btn, choice, correctAnswer, currentList[currentIndex]);
                optionsBox.appendChild(btn);
            });
        }

        function checkQuizAnswer(clickedBtn, selected, correct, item) {
            const buttons = document.querySelectorAll('.quiz-opt-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selected === correct) {
                score++; clickedBtn.classList.add('btn-correct');
            } else {
                clickedBtn.classList.add('btn-wrong');
                buttons.forEach(btn => { if (btn.innerText === correct) btn.classList.add('btn-correct'); });
                if (!wrongWordIds.includes(item.word_id)) { wrongWordIds.push(item.word_id); localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds)); }
                if (!currentQuizWrongItems.find(w => w.word_id === item.word_id)) currentQuizWrongItems.push(item);
            }
            document.getElementById('quiz-post-actions').classList.remove('hidden');
        }

        function submitWritingAnswer() {
            const item = currentList[currentIndex];
            const userInput = document.getElementById('quiz-input').value.trim();
            document.getElementById('quiz-writing-box').classList.add('hidden');
            const quizBox = document.getElementById('quiz-box');
            
            if (userInput === item.word) {
                score++;
                quizBox.style.background = '#eaf2ea'; quizBox.style.color = '#2d5a27';
                quizBox.innerHTML = `<div>${item.meaning}</div><div style="font-size:30px; font-weight:800;">${item.word}</div>`;
            } else {
                quizBox.style.background = 'var(--danger-light)'; quizBox.style.color = 'var(--danger)';
                quizBox.innerHTML = `<div>입력: ${userInput || '없음'}</div><div>${item.meaning}</div><div style="font-size:30px; font-weight:800;">${item.word}</div>`;
                if (!wrongWordIds.includes(item.word_id)) { wrongWordIds.push(item.word_id); localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds)); }
                if (!currentQuizWrongItems.find(w => w.word_id === item.word_id)) currentQuizWrongItems.push(item);
            }
            document.getElementById('quiz-post-actions').classList.remove('hidden');
        }

        function showQuizExplanation() {
            const item = currentList[currentIndex];
            document.getElementById('qz-word-info').innerText = `${item.word} [${item.pinyin}] - ${item.meaning}`;
            document.getElementById('qz-ex-zh').innerText = item.example_zh || '';
            document.getElementById('qz-ex-py').innerText = item.example_pinyin || '';
            document.getElementById('qz-ex-ko').innerText = item.example_ko || '';
            document.getElementById('quiz-explanation-box').classList.remove('hidden');
            document.getElementById('btn-show-expl').classList.add('hidden');
            document.getElementById('quiz-post-actions').classList.add('hidden');
        }

        function prevQuizQuestion() { if (currentIndex > 0) { currentIndex--; loadQuizQuestion(); } else alert("첫 번째 문제입니다."); }
        function nextQuizQuestion() { currentIndex++; loadQuizQuestion(); }

        function openReview() {
            if (!allWords || allWords.length === 0) initData();
            showScreen('screen-review');
            wrongWordIds = JSON.parse(localStorage.getItem('hsk_wrong_words') || '[]');
            if (wrongWordIds.length === 0) {
                document.getElementById('review-empty-box').classList.remove('hidden');
                document.getElementById('review-play-box').classList.add('hidden');
            } else {
                document.getElementById('review-empty-box').classList.add('hidden');
                document.getElementById('review-play-box').classList.remove('hidden');
                currentList = allWords.filter(w => wrongWordIds.includes(w.word_id));
                currentIndex = 0; showReviewCard();
            }
        }

        function showReviewCard() {
            if (currentIndex >= currentList.length) { alert('오답 복습 완료!'); goHome(); return; }
            const item = currentList[currentIndex];
            document.getElementById('rc-word').innerText = item.word;
            document.getElementById('rc-word-back').innerText = item.word;
            document.getElementById('rc-pinyin').innerText = item.pinyin;
            document.getElementById('rc-meaning').innerText = item.meaning;
            updateStatusBadge(wordStatuses[item.word_id] || 0);
            document.getElementById('rc-ex-zh').innerText = item.example_zh || '';
            document.getElementById('rc-ex-py').innerText = item.example_pinyin || '';
            document.getElementById('rc-ex-ko').innerText = item.example_ko || '';
            document.getElementById('review-progress').innerText = `오답 복습 (${currentIndex + 1} / ${currentList.length})`;
            isFlipped = false;
            document.getElementById('rc-back').classList.add('hidden');
            document.getElementById('rc-front-content').classList.remove('hidden');
        }

        function cycleReviewStatus() {
            const item = currentList[currentIndex];
            let nextStatus = ((wordStatuses[item.word_id] || 0) + 1) % 3;
            if (nextStatus === 0) delete wordStatuses[item.word_id];
            else wordStatuses[item.word_id] = nextStatus;
            localStorage.setItem('hsk_word_statuses', JSON.stringify(wordStatuses));
            updateStatusBadge(nextStatus);
        }

        function toggleReviewCard() {
            isFlipped = !isFlipped;
            const back = document.getElementById('rc-back'), front = document.getElementById('rc-front-content');
            if (isFlipped) { front.classList.add('hidden'); back.classList.remove('hidden'); }
            else { back.classList.add('hidden'); front.classList.remove('hidden'); }
        }

        function reviewAnswer(isKnown) {
            if (isKnown) {
                wrongWordIds = wrongWordIds.filter(id => id !== currentList[currentIndex].word_id);
                localStorage.setItem('hsk_wrong_words', JSON.stringify(wrongWordIds));
            }
            currentIndex++; showReviewCard();
        }

        function showFinalResult(correctCount, totalCount) {
            showScreen('screen-result');
            document.getElementById('result-score').innerText = `${Math.round((correctCount / totalCount) * 100)}%`;
            document.getElementById('result-desc').innerText = `총 ${totalCount}문항 중 ${correctCount}문항 맞힘`;
            document.getElementById('btn-retry-wrong').style.display = currentQuizWrongItems.length === 0 ? 'none' : 'block';
        }

        function resetWrongWords() {
            if (confirm('오답노트를 초기화하시겠습니까?')) {
                localStorage.removeItem('hsk_wrong_words'); localStorage.removeItem('hsk_word_statuses');
                wrongWordIds = []; wordStatuses = {}; alert('초기화되었습니다.'); goHome();
            }
        }

        initData();
    </script>
</body>
</html>
